<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up · Tulu · ತುಳು</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+Kannada:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<!-- ============ NAV ============ -->
<header class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <span class="brand-mascot">🦜</span>
      <span class="brand-kn">ತುಳು</span>
      <span class="brand-en">Tulu</span>
    </a>
    <a href="index.html" class="btn btn-outline">← Back home</a>
  </div>
</header>

<!-- ============ AUTH ============ -->
<section class="auth">
  <div class="auth-blob auth-blob--1" aria-hidden="true"></div>
  <div class="auth-blob auth-blob--2" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="auth-head">
      <span class="brand-mascot" style="font-size:36px;">🦜</span>
      <h1 class="auth-title" id="authTitle">Create your account</h1>
      <p class="auth-sub" id="authSub">Start your Tulu journey — it's free.</p>
    </div>

    <button type="button" class="btn btn-outline btn-lg auth-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="margin-right:10px;">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.58-5.05-3.71H.94v2.34C2.42 15.98 5.48 18 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.71A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.27-1.71V4.95H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.05l3.01-2.34z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.42 2.02.94 4.95l3.01 2.34C4.66 5.16 6.65 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form class="auth-form" id="authForm" novalidate>
      <label class="auth-label" for="name" id="nameLabelWrap">
        Name
        <input class="auth-input" type="text" id="name" name="name" placeholder="Your name" autocomplete="name">
      </label>
      <label class="auth-label" for="email">
        Email
        <input class="auth-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </label>
      <label class="auth-label" for="password">
        Password
        <input class="auth-input" type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
      </label>

      <p class="auth-msg" id="authMsg" role="alert"></p>

      <button type="submit" class="btn btn-solid btn-lg auth-submit" id="submitBtn">Create account</button>
    </form>

    <p class="auth-switch">
      <span id="switchText">Already have an account?</span>
      <button type="button" class="auth-link" id="switchBtn">Log in</button>
    </p>
  </div>
</section>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand"><span class="brand-mascot">🦜</span><span class="brand-kn">ತುಳು</span><span class="brand-en">Tulu</span></div>
    <p class="footer-note">Built to keep a coastal language spoken.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</body>
</html>
